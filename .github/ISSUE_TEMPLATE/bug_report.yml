name: Bug report
description: Report a reproducible problem in CodeVerse.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security issues, use private vulnerability reporting instead of a public issue.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include minimal steps, affected route, browser, or runtime details.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js version, and whether this is local or deployed. Never include secrets.
    validations:
      required: true
